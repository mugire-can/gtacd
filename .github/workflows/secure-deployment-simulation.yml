name: Secure Deployment Simulation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-deployment-config:
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SSH private key format and size
        run: |
          echo "=== Validating SSH private key ==="
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          if head -n 1 /tmp/deploy_key | grep -qE "BEGIN (RSA |OPENSSH |)PRIVATE KEY"; then
            echo "OK: key has a valid private key header."
          else
            echo "ERROR: key does not look like a valid private key."
            exit 1
          fi

          KEY_BITS=$(ssh-keygen -lf /tmp/deploy_key | awk '{print $1}')
          echo "Detected key size: $KEY_BITS bits"
          if [ "$KEY_BITS" -lt 2048 ]; then
            echo "ERROR: key size below the 2048-bit minimum requirement."
            exit 1
          else
            echo "OK: key size meets the minimum requirement."
          fi

      - name: Confirm key has no passphrase
        run: |
          echo "=== Checking for passphrase ==="
          if ssh-keygen -y -P "" -f /tmp/deploy_key > /dev/null 2>&1; then
            echo "OK: key is not passphrase-protected (required for automation)."
          else
            echo "ERROR: key appears to be passphrase-protected."
            exit 1
          fi

      - name: Validate server configuration secrets
        run: |
          echo "=== Validating server configuration ==="
          if [ -z "$SERVER_IP" ]; then
            echo "ERROR: SERVER_IP secret is not set."
            exit 1
          fi
          if [ -z "$SERVER_USER" ]; then
            echo "ERROR: SERVER_USER secret is not set."
            exit 1
          fi
          if [[ "$SERVER_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "OK: SERVER_IP format looks valid."
          else
            echo "ERROR: SERVER_IP does not look like a valid IPv4 address."
            exit 1
          fi
          echo "OK: SERVER_USER is set to '$SERVER_USER'."

      - name: Simulate SSH connection and deployment commands
        run: |
          echo "=== Simulating deployment (no real network access) ==="
          echo "Would connect via: ssh -i <private_key> $SERVER_USER@$SERVER_IP"
          echo "Would run: sudo apt update && sudo apt install -y nginx"
          echo "Would run: sudo mkdir -p /var/www/html/tp-app"
          echo "Would run: rsync app/ to $SERVER_USER@$SERVER_IP:/var/www/html/tp-app"
          echo "Would run: sudo systemctl restart nginx"
          echo "=== Simulation completed successfully ==="

      - name: Security best-practice checks
        run: |
          echo "=== Security checks summary ==="
          echo "- Dedicated non-root deployment user: $SERVER_USER"
          echo "- Passphrase-less key restricted to automation use only"
          echo "- Secrets stored in GitHub Secrets, not in repository code"
          echo "- Private key written only to a runner temp file, never logged"
          rm -f /tmp/deploy_key
          echo "OK: temporary key file removed from runner."
---
- name: Deploy GTACD application to target server
  hosts: webservers
  become: true

  vars:
    app_dest_dir: /var/www/html/tp-app

  tasks:
    - name: Install Nginx web server
      apt:
        name: nginx
        state: present
        update_cache: true

    - name: Create application destination directory
      file:
        path: "{{ app_dest_dir }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Copy application files to the server
      copy:
        src: ../app/
        dest: "{{ app_dest_dir }}/"
        owner: www-data
        group: www-data
        mode: "0644"

    - name: Configure Nginx virtual host from template
      template:
        src: nginx_vhost.conf.j2
        dest: /etc/nginx/sites-available/tp-app
        owner: root
        group: root
        mode: "0644"
      notify: Restart nginx

    - name: Enable the tp-app site
      file:
        src: /etc/nginx/sites-available/tp-app
        dest: /etc/nginx/sites-enabled/tp-app
        state: link
      notify: Restart nginx

    - name: Remove default Nginx site if present
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Restart nginx

  handlers:
    - name: Restart nginx
      service:
        name: nginx
        state: restarted